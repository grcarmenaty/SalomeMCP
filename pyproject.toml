[project]
name = "salome-mcp"
version = "0.1.0"
description = "Model Context Protocol server for building Salome structures from descriptions, images, and vibrational targets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SalomeMCP contributors" }]
keywords = ["mcp", "salome", "cad", "cae", "fem", "geometry", "meshing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
salome-mcp = "salome_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salome_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
